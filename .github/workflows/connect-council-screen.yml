name: Connect council screen

on:
  push:
    branches:
      - glowny_main
    paths:
      - .github/workflows/connect-council-screen.yml

permissions:
  contents: write

jobs:
  connect-council-screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: glowny_main

      - name: Connect illustrated council screen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          screens_path = Path("rg_screens.py")
          screens = screens_path.read_text(encoding="utf-8")
          marker = "from rg_council_background import draw_council as _draw_council_with_background"
          override = (
              "\n\n# Ilustrowany ekran modułu Rada Bohaterów.\n"
              f"{marker}\n"
              "draw_council = _draw_council_with_background\n"
          )
          if marker not in screens:
              screens_path.write_text(screens.rstrip() + override, encoding="utf-8")

          Path(".github/workflows/connect-council-screen.yml").unlink()
          PY

      - name: Commit connection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Podłącz ilustrację do Rady Bohaterów"
            git push origin HEAD:glowny_main
          fi
