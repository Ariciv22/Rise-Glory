name: Test final quests

on:
  push:
    branches: [glowny_main]
    paths:
      - "rg_content/**"
      - "rg_engine/**"
      - "tests/**"
      - ".github/workflows/test-final-quests.yml"
  pull_request:
    paths:
      - "rg_content/**"
      - "rg_engine/**"
      - "tests/**"

jobs:
  quest-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --upgrade pytest

      - name: Compile quest modules
        run: |
          python -m py_compile \
            rg_content/quest_runtime_ext.py \
            rg_content/quest_pack_common.py \
            rg_content/quests_pack_01_08.py \
            rg_content/quests_pack_09_16.py \
            rg_content/quests_pack_17_23.py \
            rg_content/quests_final.py \
            rg_content/locations.py

      - name: Run final quest regression tests
        run: python -m pytest -q tests/test_final_quests_01_23.py
