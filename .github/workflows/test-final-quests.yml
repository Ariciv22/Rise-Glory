name: Test final quests

on:
  push:
    branches: [glowny_main]
    paths:
      - "main.py"
      - "rg_content/**"
      - "rg_engine/**"
      - "rg_core/**"
      - "rg_world/**"
      - "rg_ui/**"
      - "tests/**"
      - ".github/workflows/test-final-quests.yml"
  pull_request:
    paths:
      - "main.py"
      - "rg_content/**"
      - "rg_engine/**"
      - "rg_core/**"
      - "rg_world/**"
      - "rg_ui/**"
      - "tests/**"
      - ".github/workflows/test-final-quests.yml"

jobs:
  quest-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            main.py
            rg_content
            rg_engine
            rg_core
            rg_world
            rg_ui
            tests

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --upgrade pytest

      - name: Compile quest, developer and production modules
        run: |
          python -m py_compile \
            main.py \
            rg_core/app.py \
            rg_content/quest_runtime_ext.py \
            rg_content/quest_special_rewards.py \
            rg_content/quest_pack_common.py \
            rg_content/quests_pack_01_08.py \
            rg_content/quests_pack_09_16.py \
            rg_content/quests_pack_17_23.py \
            rg_content/quests_pack_24_30.py \
            rg_content/quests_final.py \
            rg_content/locations.py \
            rg_engine/dev_quest_tools.py \
            rg_engine/production.py \
            rg_ui/city_hub.py \
            rg_ui/font_theme.py \
            rg_ui/hex_info_panel.py \
            rg_ui/map_ui_regression_fixes.py \
            rg_ui/threat_adjacent_resolution.py \
            rg_ui/location_menu_hitbox_fix.py \
            rg_ui/location_quest_board.py \
            rg_ui/dev_menu.py \
            rg_ui/dev_menu_input_fix.py \
            rg_ui/production_hud.py \
            rg_ui/production_location_hub.py \
            rg_ui/council_flow.py \
            rg_world/generation.py \
            rg_world/production_visuals.py \
            rg_world/quest_places.py \
            rg_core/bootstrap.py \
            rg_core/setup.py

      - name: Run final quest, developer, production and map regression tests
        run: python -m pytest -q tests/test_final_quests_01_23.py tests/test_dev_quest_picker.py tests/test_engine_production.py tests/test_map_renderer_chain.py
