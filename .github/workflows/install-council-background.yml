name: Install council background

on:
  push:
    branches:
      - agent/rada-bohaterow-background
    paths:
      - .github/workflows/install-council-background.yml

permissions:
  contents: write

jobs:
  install-council-background:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/rada-bohaterow-background

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build image and connect council screen
        shell: bash
        run: |
          python - <<'PY'
          from base64 import b64decode
          from io import BytesIO
          from pathlib import Path
          import shutil

          from PIL import Image

          parts_dir = Path("Grafiki/rada_bohaterów.png.parts")
          parts = sorted(parts_dir.glob("part*.b64"))
          if not parts:
              raise SystemExit("Brak części grafiki Rady Bohaterów")

          encoded = "".join(part.read_text(encoding="ascii").strip() for part in parts)
          raw_image = b64decode(encoded, validate=True)
          image = Image.open(BytesIO(raw_image)).convert("RGB")
          image.save("Grafiki/rada_bohaterów.png", format="PNG", optimize=True)

          screens_path = Path("rg_screens.py")
          screens = screens_path.read_text(encoding="utf-8")
          marker = "from rg_council_background import draw_council as _draw_council_with_background"
          override = (
              "\n\n# Ilustrowany ekran modułu Rada Bohaterów.\n"
              f"{marker}\n"
              "draw_council = _draw_council_with_background\n"
          )
          if marker not in screens:
              screens_path.write_text(screens.rstrip() + override, encoding="utf-8")

          shutil.rmtree(parts_dir)
          Path(".github/workflows/install-council-background.yml").unlink()
          PY

      - name: Commit generated asset and code connection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Podłącz ilustrację do Rady Bohaterów"
            git push origin HEAD:agent/rada-bohaterow-background
          fi
